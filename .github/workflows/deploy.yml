name: انتشار پزشک‌یار

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: نصب وابستگی‌ها
        run: npm ci

      - name: ساخت پروژه
        run: npm run build

      - name: ساخت fallback برای React Router
        run: cp dist/index.html dist/404.html

      - name: انتشار خروجی در شاخه gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
